# ── Service: kiada-go ─────────────────────────────────────────────────────────
# ClusterIP — internal cluster access (Chapter 11 Service pattern)
# Exposes port 80 → container port 8080
apiVersion: v1
kind: Service
metadata:
  name: kiada-go
  namespace: kiada
  labels:
    app: kiada-go
spec:
  type: ClusterIP
  selector:
    app: kiada-go
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
---
# ── Service: kiada-go-nodeport ────────────────────────────────────────────────
# NodePort — for direct access in dev/testing (Chapter 11 NodePort pattern)
apiVersion: v1
kind: Service
metadata:
  name: kiada-go-nodeport
  namespace: kiada
  labels:
    app: kiada-go
spec:
  type: NodePort
  selector:
    app: kiada-go
  ports:
  - name: http
    port: 80
    targetPort: 8080
    nodePort: 30880
    protocol: TCP
