# ── HorizontalPodAutoscaler: kiada-go ─────────────────────────────────────────
# Auto-scales the deployment based on CPU utilisation.
# Builds on the ReplicaSet / Deployment concepts from Chapters 14-15.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kiada-go
  namespace: kiada
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kiada-go
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
